name: Core checks

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  core:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install core and test tools
        run: python -m pip install -e ".[dev]"
      - name: Test deterministic core (no models or private images)
        run: python -m pytest --basetemp test-output/ci
      - name: Check distributable sources
        run: python scripts/check_release.py
      - name: Build wheel and source archive
        run: python -m build
