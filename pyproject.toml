[build-system]
requires = ["setuptools>=75", "wheel>=0.44"]
build-backend = "setuptools.build_meta"

[project]
name = "photocleaner"
dynamic = ["version"]
description = "Local image screening, file organization and visual search workbench"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Pillow>=10.4,<13",
    "numpy>=1.26,<3",
    "pillow-heif>=0.18,<2",
    "pywin32>=310,<400; sys_platform == 'win32'",
]

[project.optional-dependencies]
ai = ["transformers==4.57.6", "torch==2.14.1"]
dev = ["pytest>=8,<10", "build>=1.2,<2"]

[project.scripts]
photocleaner = "photocleaner.bootstrap:main"

[tool.setuptools]
packages = ["photocleaner"]

[tool.setuptools.dynamic]
version = {attr = "photocleaner.__version__"}

[tool.setuptools.data-files]
"share/photocleaner/help" = ["help/*.md"]
"share/photocleaner/defaults" = ["defaults/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 120
